<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SysGlance</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>SysGlance</h1>
    <div class="meta">
      <span id="timestamp">--</span>
      <span class="uptime">uptime: <span id="uptime">--</span></span>
    </div>
  </header>

  <main class="grid">
    <section class="card">
      <h2>CPU</h2>
      <div class="big-stat" id="cpu-overall">--%</div>
      <div class="cores" id="cpu-cores"></div>
      <div class="subtext" id="load-avg">load avg: --</div>
    </section>

    <section class="card">
      <h2>Memory</h2>
      <div class="big-stat" id="mem-percent">--%</div>
      <div class="bar"><div class="bar-fill" id="mem-bar"></div></div>
      <div class="subtext" id="mem-detail">-- / --</div>
      <div class="subtext" id="swap-detail">swap: --</div>
    </section>

    <section class="card">
      <h2>Disk</h2>
      <div class="big-stat" id="disk-percent">--%</div>
      <div class="bar"><div class="bar-fill" id="disk-bar"></div></div>
      <div class="subtext" id="disk-detail">-- / --</div>
    </section>

    <section class="card">
      <h2>Network</h2>
      <div class="subtext">sent: <span id="net-sent">--</span></div>
      <div class="subtext">recv: <span id="net-recv">--</span></div>
    </section>

    <section class="card wide">
      <h2>Top processes (by CPU)</h2>
      <table id="proc-table">
        <thead>
          <tr><th>PID</th><th>Name</th><th>CPU%</th><th>MEM%</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
